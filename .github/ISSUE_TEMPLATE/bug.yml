name: Something is broken
description: Tell me what happened. The extension keeps no logs and sends nothing, so what you paste here is all I have to go on.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two things I would ask for anyway, so this saves us a round trip.
  - type: input
    id: version
    attributes:
      label: Version
      description: At the bottom of the popup, next to "Lil Bro v".
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Brave 1.70, Chrome 140
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in your own words. Whether it deleted something it should have kept, or kept something it should have deleted, matters most.
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What you did before that
      description: Which rule you used and which mode you are in, if you know them. A rule that matched too much is usually visible here.
  - type: input
    id: language
    attributes:
      label: Which language is the app in
      placeholder: English, Polski
