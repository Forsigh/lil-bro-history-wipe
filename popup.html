<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lil Bro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div class="popup-wrap">
      <header class="phead">
        <div class="brand">
          <img class="brand-mark" src="icons/icon32.png" alt="" width="30" height="30" />
          <span class="brand-text"><b>Lil Bro</b><small data-i18n="brandSub">History Wipe</small></span>
        </div>
        <span class="pill"><span class="dot" id="dot"></span><span id="status">Loading…</span></span>
      </header>

      <section class="hero">
        <div class="hero-top">
          <span class="hero-title" data-i18n="cleaningTitle">Cleaning</span>
          <button id="toggleBtn" class="switch" role="switch" aria-checked="true">
            <span class="knob"></span>
            <span class="switch-label" id="switchLabel" data-i18n="switchOn">On</span>
          </button>
        </div>
        <p class="hero-line" id="modeText"></p>
      </section>

      <div class="card">
        <div class="row mini" id="sitePreview">Checking this tab…</div>
        <div class="row">
          <button id="addDomainBtn" class="grow" data-i18n="addSite">Add to filter list</button>
        </div>
        <div class="row">
          <label class="pill"><input type="checkbox" id="subdomains" /> <span data-i18n="includeSubdomains">subdomains too</span></label>
          <button id="addUrlBtn" class="ghost grow" data-i18n="addPage">Add just this page</button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <button id="wipeBtn" class="grow" data-i18n="wipeNow">Wipe now</button>
          <button id="previewBtn" class="ghost" data-i18n="preview">Scan</button>
        </div>
        <div class="row hidden" id="phraseRow">
          <input id="confirmPhrase" class="grow" type="text" placeholder="WIPE ALL" />
          <button id="confirmPhraseBtn" data-i18n="arm">Arm</button>
        </div>
        <div class="row mini" id="wipeMsg"></div>
        <div id="previewList" class="lockable"></div>
      </div>

      <div class="card hidden lockbox" id="lockCard">
        <div class="row mini" id="lockNote"></div>
        <div class="row">
          <input id="lockPin" class="grow" type="password" data-i18n-placeholder="pinPlaceholder" placeholder="PIN" />
          <button id="lockUnlock" data-i18n="unlock">Unlock</button>
        </div>
        <div class="row mini" id="lockMsg"></div>
        <div class="row" id="forgotRow">
          <button id="lockForgot" class="ghost grow" data-i18n="forgotPin">Forgot the PIN?</button>
        </div>
        <div class="row hidden" id="recoverRow">
          <input id="lockRecovery" class="grow" type="text" placeholder="type lilbro" />
          <button id="lockRecoverBtn" class="danger" data-i18n="reset">Reset</button>
        </div>
      </div>

      <footer class="pfoot">
        <button id="openOptions" class="ghost grow" data-i18n="openOptions">All settings</button>
        <div class="mini" id="version"></div>
      </footer>

      <!-- The popup shows three things. The script still keeps these in sync, so they
           stay here, hidden, until their handlers come out with the next change. -->
      <div class="hidden" aria-hidden="true">
        <button id="layoutBtn" class="chip-btn"><span data-i18n="layoutBtn">Classic</span></button>
        <p id="extraLine"></p>
        <p id="wipeAllWarn"></p>
        <div id="extraRow"><button id="extraBtn"></button></div>
        <div id="more">
          <div id="queueInfo"></div>
          <input type="radio" name="scope" id="scopeList" />
          <input type="radio" name="scope" id="scopeAll" />
        </div>
        <div id="moreBtn"><span></span></div>
        <b id="statTotal">0</b><b id="statLast">0</b>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
